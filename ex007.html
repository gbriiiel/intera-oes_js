<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando numeros</title>

    <style>
        body{
            font: 18pt Arial;
        }

        input{
            font: 18pt Arial;
        }

        div#res{
            margin-top: 20px;
        }
    </style>

</head>
<body>
    <h1>Somando valores</h1>
    <input type="number" name="txtn1" id="txtn1">
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="somar" onclick="somar()">
    <div id="res">Resultado: </div>

    <script>
        function somar(){
            var x= window.document.getElementById('txtn1')
            var y= window.document.getElementById('txtn2')
            var res= window.document.getElementById('res')

            var n1 = Number(x.value)
            var n2 = Number(y.value)
            var s = n1 + n2
            res.innerHTML = `O resultado da soma entre ${n1} e ${n2} eh igual a <strong>${s}<strong>`
        }
    </script>
</body>
</html>
